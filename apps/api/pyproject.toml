[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is the idiomatic pattern

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
exclude = ["\\.venv", "alembic/versions"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
